<!DOCTYPE html>
<html>
    <head>
        <title>Number Guessing Game</title>

        <style>
            body {
                text-align: center;
                font-family: Arial;
                margin-top: 60px;
            }

            input {
                padding: 8px;
                font-size: 16px;
            }

            button {
                padding: 8px 15px;
                margin-top: 10px;
            }

            #message {
                margin-top: 20px;
                font-size: 18px;
            }
        </style>

        <style>
            body 
            {
                margin: 0;
                height: 100vh;
                display: flex;
                justify-content: center;
                align-items: center;
                font-family: 'Segoe UI', sans-serif;
                background: linear-gradient(135deg, #667eea, #764ba2);
            }

            .game-container {
                background: rgba(255, 255, 255, 0.15);
                backdrop-filter: blur(15px);
                padding: 40px;
                border-radius: 20px;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
                text-align: center;
                color: white;
                width: 350px;
                transition: transform 0.3s ease;
            }

            .game-container:hover {
                transform: scale(1.03);
            }

            h1 {
                margin-bottom: 10px;
                font-size: 28px;
            }

            h3 {
                font-weight: normal;
                margin-bottom: 20px;
                opacity: 0.9;
            }

            input {
                width: 80%;
                padding: 10px;
                border-radius: 10px;
                border: none;
                outline: none;
                font-size: 16px;
                text-align: center;
                margin-bottom: 15px;
                transition: 0.3s;
            }

            input:focus {
                box-shadow: 0 0 10px #ffffff;
            }

            button {
                padding: 10px 20px;
                border-radius: 10px;
                border: none;
                background: #ffcc00;
                color: #333;
                font-size: 16px;
                cursor: pointer;
                transition: 0.3s ease;
            }

            button:hover {
                background: #ffd633;
                transform: translateY(-3px);
                box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            }

            #message {
                margin-top: 20px;
                font-size: 18px;
                font-weight: bold;
                min-height: 24px;
            }

            #attempts {
                font-weight: bold;
                color: #ffeb3b;
            }
        </style>
    </head>

    <body>

        <h1>
            🔢 Number Guessing Game
        </h1>

        <h3>
            Guess a number between 1 and 100
        </h3>

        <input type="number" id="guessInput">

        <br>

        <button onclick="checkGuess()">Guess</button>

        <p id="message"></p>

        <p>Attempts: <span id="attempts">0</span></p>

        <script>

            var secretNumber = Math.floor(Math.random() * 100) + 1;

            var attemptCount = 0;

            function checkGuess() 
            {

                var userGuess = document.getElementById("guessInput").value;
            
                attemptCount++;

                document.getElementById("attempts").innerHTML = attemptCount;

                if (userGuess == secretNumber) 
                {
                    document.getElementById("message").innerHTML = "🎉 Correct! The number was " + secretNumber;
                }
                else if (userGuess < secretNumber) 
                {
                    document.getElementById("message").innerHTML = "📉 Too low! Try again.";
                }
                else 
                {
                    document.getElementById("message").innerHTML = "📈 Too high! Try again.";
                }
            }
        </script>
    </body>
</html>
